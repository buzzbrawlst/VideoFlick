<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StreamHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080808;
            --card: #141414;
            --card-hover: #1c1c1c;
            --text: #ffffff;
            --muted: #a0a0a0;
            --accent: #e50914;
            --border: rgba(255,255,255,0.08);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        body.no-scroll {
            overflow: hidden;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            z-index: 1000;

            display: flex;
            align-items: center;
            padding: 0 5%;

            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.95),
                rgba(0,0,0,0.75),
                transparent
            );
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            color: var(--accent);
            text-decoration: none;
            margin-right: 40px;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: white;
        }

        .nav-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search {
            width: 230px;
            padding: 10px 14px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.65);
            color: white;
            outline: none;
        }

        .search::placeholder {
            color: #999;
        }

        .profile {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e50914, #8b0000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            height: 75vh;
            min-height: 550px;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            inset: 0;

            background-size: cover;
            background-position: center;

            opacity: 0.75;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to right,
                    rgba(0,0,0,0.95) 0%,
                    rgba(0,0,0,0.75) 35%,
                    rgba(0,0,0,0.2) 75%,
                    rgba(0,0,0,0.7) 100%
                ),
                linear-gradient(
                    to top,
                    var(--bg),
                    transparent 35%
                );
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 650px;
            margin-left: 5%;
            padding-top: 80px;
        }

        .hero-badge {
            display: inline-block;
            padding: 6px 10px;
            background: var(--accent);
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: clamp(40px, 6vw, 75px);
            line-height: 0.95;
            margin-bottom: 20px;
        }

        .hero-description {
            color: #ccc;
            line-height: 1.6;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .hero-meta {
            display: flex;
            gap: 15px;
            color: #ddd;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .hero-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            border: none;
            padding: 13px 22px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn:hover {
            transform: scale(1.03);
        }

        .btn-primary {
            background: white;
            color: black;
        }

        .btn-secondary {
            background: rgba(70,70,70,0.8);
            color: white;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            position: relative;
            z-index: 5;
            margin-top: -60px;
            padding-bottom: 80px;
        }

        .section {
            margin-bottom: 45px;
            padding: 0 5%;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
        }

        .see-all {
            color: #aaa;

        }

        .see-all:hover {
            color: white;
        }

        /* =========================
           VIDEO GRID
        ========================= */

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
        }

        .video-card {
            background: var(--card);
            border-radius: 7px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s, background 0.25s;
        }

        .video-card:hover {
            transform: translateY(-5px);
            background: var(--card-hover);
        }

        .thumbnail {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #222;
            overflow: hidden;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .duration {
            position: absolute;
            bottom: 7px;
            right: 7px;
            background: rgba(0,0,0,0.85);
            padding: 4px 6px;
            border-radius: 3px;
            font-size: 11px;
        }

        .type-badge {
            position: absolute;
            top: 7px;
            left: 7px;
            background: rgba(0,0,0,0.85);
            padding: 5px 7px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
        }

        .live-badge {
            background: #e50914;
        }

        .card-content {
            padding: 12px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 7px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-description {
            color: #999;
            font-size: 12px;
            line-height: 1.4;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            color: #777;
            font-size: 11px;
            margin-top: 8px;
        }

        /* =========================
           CATEGORIES
        ========================= */

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .category-card {
            height: 110px;
            border-radius: 7px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            background: #222;
        }

        .category-card img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.55;
            transition: 0.3s;
        }

        .category-card:hover img {
            opacity: 0.8;
            transform: scale(1.05);
        }

        .category-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(0,0,0,0.9),
                transparent
            );
        }

        .category-info {
            position: absolute;
            bottom: 12px;
            left: 14px;
        }

        .category-icon {
            font-size: 20px;
            margin-right: 5px;
        }

        .category-name {
            font-weight: bold;
        }

        /* =========================
           SEARCH RESULTS
        ========================= */

        #searchSection {
            display: none;
        }

        /* =========================
           MODALS
        ========================= */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 3000;

            background: rgba(0,0,0,0.9);

            display: none;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {

            max-height: 90vh;
            overflow-y: auto;

            background: #111;
            border-radius: 10px;
            position: relative;
        }

        .close {
            position: absolute;
            right: 18px;
            top: 15px;
            z-index: 10;

            width: 38px;
            height: 38px;

            border: none;
            border-radius: 50%;

            background: rgba(0,0,0,0.75);
            color: white;

            font-size: 20px;
            cursor: pointer;
        }

        /* =========================
           VIDEO PLAYER
        ========================= */

        .player-container {
            width: 100%;
            background: black;
        }

        .player-container video {
            width: 100%;
            max-height: 70vh;
            display: block;
        }

        .player-info {
            padding: 22px;
        }

        .player-info h2 {

            color: #aaa;

        }

        ========================= */

            width: 100%;

            position: absolute;

            padding: 0 30px 25px;

            display: inline-block;

            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .series-title {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .series-description {

            color: #aaa;

        }

        .series-meta {

        }

        .series-content {
            padding: 0 30px 30px;
        }

        .season-bar {

        .episode-info {

        .episode-title {

            font-weight: bold;

        }

        .episode-description {

            line-height: 1.5;
        }

        .episode-duration {
            color: #aaa;
            font-size: 12px;
            align-self: center;

        ========================= */

        .empty {

            padding: 30px 0;

        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            border-top: 1px solid var(--border);
            padding: 35px 5%;
            color: #666;
            font-size: 13px;
        }

           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            .navbar {

            .search {

                display: none;

            .profile {

            }

            .video-grid {

            }

            .category-grid {
                grid-template-columns: 1fr;
            }

            .episode {
                grid-template-columns: 1fr;
            }

            .episode-thumbnail {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<script>

    /* =========================
       GLOBAL DATA
    ========================= */

    let siteData = null;
    let allItems = [];

    let currentSeries = null;


    /* =========================
       LOAD JSON
    ========================= */

    async function loadData() {

        try {

            const response = await fetch("videos.json");

            if (!response.ok) {
                throw new Error("Could not load videos.json");
            }

            siteData = await response.json();

            allItems = siteData.videos || [];

            setupSite();

        } catch (error) {

            console.error(error);

            document.body.innerHTML = `
                <div style="
                    padding:50px;
                    color:white;
                    font-family:Arial;
                    text-align:center;
                ">
                    <h1>Failed to load site data</h1>
                    <p style="color:#888;margin-top:10px;">
                        Make sure videos.json exists in the same folder as index.html.
                    </p>
                </div>
            `;

        }

    }


    /* =========================
       SETUP
    ========================= */

    function setupSite() {

        document.title =
            siteData.site?.name || "StreamHub";

        document.querySelector(".logo").textContent =
            siteData.site?.name || "StreamHub";

        document.getElementById("footerName").textContent =
            siteData.site?.name || "StreamHub";

        setupFeatured();

        renderVideos();

        renderCategories();

    }


    /* =========================
       FEATURED
    ========================= */

    function setupFeatured() {

        const featured = siteData.featured;

        if (!featured) {
            return;
        }

        document.getElementById("heroTitle").textContent =
            featured.title || "";

        document.getElementById("heroDescription").textContent =
            featured.description || "";

        document.getElementById("heroYear").textContent =
            featured.year || "";

        document.getElementById("heroDuration").textContent =
            featured.duration || "";

        document.getElementById("heroQuality").textContent =
            featured.quality || "";

        document.getElementById("heroBackground").style.backgroundImage =
            `url("${featured.thumbnail}")`;


        document.getElementById("heroPlay").onclick = () => {

            const item = findItem(featured.title);

            if (item) {

                if (isSeries(item)) {
                    openSeries(item);
                } else {
                    openVideo(item);
                }

            } else {

                openVideo({
                    title: featured.title,
                    description: featured.description,
                    video: featured.video
                });

            }

        };


        document.getElementById("heroMore").onclick = () => {

            const item = findItem(featured.title);

            if (item && isSeries(item)) {

                openSeries(item);

            } else if (item) {

                openVideo(item);

            } else {

                openVideo({
                    title: featured.title,
                    description: featured.description,
                    video: featured.video
                });

            }

        };

    }


    /* =========================
       VIDEO RENDERING
    ========================= */

    function renderVideos() {

        const trending =
            allItems.filter(item => item.trending);

        const recent =
            allItems.filter(item => item.recent);

        renderGrid(
            document.getElementById("trendingGrid"),
            trending
        );

        renderGrid(
            document.getElementById("recentGrid"),
            recent
        );

        renderGrid(
            document.getElementById("allGrid"),
            allItems
        );

    }


    function renderGrid(container, items) {

        container.innerHTML = "";

        if (!items.length) {

            container.innerHTML = `
                <div class="empty">
                    Nothing here yet.
                </div>
            `;

            return;

        }

        items.forEach(item => {

            container.appendChild(
                createVideoCard(item)
            );

        });

    }


    /* =========================
       VIDEO / SERIES CARD
    ========================= */

    function createVideoCard(item) {

        const card =
            document.createElement("div");

        card.className = "video-card";

        const series =
            isSeries(item);

        let duration =
            item.duration || "";

        let typeBadge = "";

        if (series) {

            const seasonCount =
                item.seasons?.length || 0;

            typeBadge = `
                <div class="type-badge">
                    SERIES · ${seasonCount} SEASON${seasonCount === 1 ? "" : "S"}
                </div>
            `;

            duration = "";

        } else if (item.isLive) {

            typeBadge = `
                <div class="type-badge live-badge">
                    LIVE
                </div>
            `;

        }


        card.innerHTML = `

            <div class="thumbnail">

                <img
                    src="${item.thumbnail || ""}"
                    alt="${escapeHTML(item.title || "")}"
                    loading="lazy"
                >

                ${typeBadge}

                ${
                    duration
                    ? `<div class="duration">${duration}</div>`
                    : ""
                }

            </div>

            <div class="card-content">

                <div class="card-title">
                    ${escapeHTML(item.title || "Untitled")}
                </div>

                <div class="card-description">
                    ${escapeHTML(item.description || "")}
                </div>

                <div class="card-meta">

                    ${
                        series
                        ? `${item.year || ""} · Series`
                        : `${item.views || ""} ${item.year ? "· " + item.year : ""}`
                    }

                </div>

            </div>

        `;


        card.onclick = () => {

            if (series) {

                openSeries(item);

            } else {

                openVideo(item);

            }

        };


        return card;

    }


    /* =========================
       SERIES CHECK
    ========================= */

    function isSeries(item) {

        return item &&
            item.type === "series";

    }


    /* =========================
       OPEN SERIES
    ========================= */

    function openSeries(series) {

        currentSeries = series;

        document.getElementById("seriesTitle").textContent =
            series.title || "";

        document.getElementById("seriesDescription").textContent =
            series.description || "";

        document.getElementById("seriesYear").textContent =
            series.year ? series.year : "";

        document.getElementById("seriesCategory").textContent =
            series.category ? series.category : "";

        const seasons =
            series.seasons || [];

        document.getElementById("seriesSeasons").textContent =
            `${seasons.length} Season${seasons.length === 1 ? "" : "s"}`;


        const banner =
            document.getElementById("seriesBanner");

        banner.src =
            series.banner ||
            series.thumbnail ||
            "";


        const select =
            document.getElementById("seasonSelect");

        select.innerHTML = "";


        seasons.forEach((season, index) => {

            const option =
                document.createElement("option");

            option.value = index;

            option.textContent =
                `Season ${season.season ?? index + 1}`;

            select.appendChild(option);

        });


        select.onchange = () => {

            renderEpisodes(
                parseInt(select.value)
            );

        };


        if (seasons.length) {

            select.value = 0;

            renderEpisodes(0);

        } else {

            document.getElementById("episodeList").innerHTML = `
                <div class="empty">
                    No episodes available.
                </div>
            `;

        }


        document.getElementById("seriesModal")
            .classList.add("active");

        document.body.classList.add("no-scroll");

    }


    /* =========================
       RENDER EPISODES
    ========================= */

    function renderEpisodes(seasonIndex) {

        const list =
            document.getElementById("episodeList");

        list.innerHTML = "";

        if (!currentSeries) {
            return;
        }

        const seasons =
            currentSeries.seasons || [];

        const season =
            seasons[seasonIndex];

        if (!season || !season.episodes?.length) {

            list.innerHTML = `
                <div class="empty">
                    No episodes available.
                </div>
            `;

            return;

        }


        season.episodes.forEach((episode, index) => {

            const episodeElement =
                document.createElement("div");

            episodeElement.className =
                "episode";


            const episodeNumber =
                episode.episode ?? index + 1;


            episodeElement.innerHTML = `

                <div class="episode-thumbnail">

                    <img
                        src="${episode.thumbnail || currentSeries.thumbnail || ""}"
                        alt="${escapeHTML(episode.title || "")}"
                        loading="lazy"
                    >

                    <div class="episode-number">
                        E${episodeNumber}
                    </div>

                </div>


                <div class="episode-info">

                    <div class="episode-title">

                        ${episodeNumber}.
                        ${escapeHTML(
                            episode.title ||
                            `Episode ${episodeNumber}`
                        )}

                    </div>

                    <div class="episode-description">

                        ${escapeHTML(
                            episode.description || ""
                        )}

                    </div>

                </div>


                <div class="episode-duration">

                    ${escapeHTML(
                        episode.duration || ""
                    )}

                </div>

            `;


            episodeElement.onclick = () => {

                openEpisode(
                    episode,
                    currentSeries,
                    season.season,
                    episodeNumber
                );

            };


            list.appendChild(
                episodeElement
            );

        });

    }


    /* =========================
       OPEN EPISODE
    ========================= */

    function openEpisode(
        episode,
        series,
        seasonNumber,
        episodeNumber
    ) {

        const video = {

            title:
                `${series.title} — S${seasonNumber} E${episodeNumber} · ${episode.title || ""}`,

            description:
                episode.description || series.description || "",

            video:
                episode.video,

            thumbnail:
                episode.thumbnail

        };


        closeSeriesModal();

        openVideo(video);

    }


    /* =========================
       VIDEO PLAYER
    ========================= */

    function openVideo(item) {

        const modal =
            document.getElementById("videoModal");

        const player =
            document.getElementById("videoPlayer");


        document.getElementById("playerTitle").textContent =
            item.title || "Video";

        document.getElementById("playerDescription").textContent =
            item.description || "";


        player.pause();

        player.src =
            item.video || "";

        player.poster =
            item.thumbnail || "";


        modal.classList.add("active");

        document.body.classList.add("no-scroll");


        player.load();


        const playPromise =
            player.play();

        if (playPromise) {

            playPromise.catch(() => {
                // Browser autoplay may be blocked.
            });

        }

    }


    /* =========================
       CLOSE VIDEO
    ========================= */

    function closeVideoModal(event) {

        if (
            event &&
            event.target !== event.currentTarget
        ) {
            return;
        }


        const modal =
            document.getElementById("videoModal");

        const player =
            document.getElementById("videoPlayer");


        player.pause();

        player.removeAttribute("src");

        player.load();

        modal.classList.remove("active");

        document.body.classList.remove("no-scroll");

    }


    /* =========================
       CLOSE SERIES
    ========================= */

    function closeSeriesModal(event) {

        if (
            event &&
            event.target !== event.currentTarget
        ) {
            return;
        }


        document
            .getElementById("seriesModal")
            .classList.remove("active");


        document.body.classList.remove("no-scroll");

        currentSeries = null;

    }


    /* =========================
       CATEGORIES
    ========================= */

    function renderCategories() {

        const grid =
            document.getElementById("categoryGrid");

        grid.innerHTML = "";


        const categories =
            siteData.categories || [];


        categories.forEach(category => {

            const card =
                document.createElement("div");

            card.className =
                "category-card";


            card.innerHTML = `

                <img
                    src="${category.image || ""}"
                    alt="${escapeHTML(category.name || "")}"
                    loading="lazy"
                >

                <div class="category-overlay"></div>

                <div class="category-info">

                    <span class="category-icon">
                        ${category.icon || ""}
                    </span>

                    <span class="category-name">
                        ${escapeHTML(category.name || "")}
                    </span>

                </div>

            `;


            card.onclick = () => {

                filterCategory(
                    category.name
                );

            };


            grid.appendChild(card);

        });

    }


    /* =========================
       CATEGORY FILTER
    ========================= */

    function filterCategory(category) {

        const filtered =
            allItems.filter(item =>
                String(item.category).toLowerCase() ===
                String(category).toLowerCase()
            );


        document.getElementById("allSection")
            .scrollIntoView({
                behavior: "smooth"
            });


        renderGrid(
            document.getElementById("allGrid"),
            filtered
        );


        document.querySelector(
            "#allSection .section-title"
        ).textContent =
            category;

    }


    /* =========================
       SHOW ALL
    ========================= */

    function showAllVideos() {

        renderGrid(
            document.getElementById("allGrid"),
            allItems
        );


        document.querySelector(
            "#allSection .section-title"
        ).textContent =
            "All Videos";


        document.getElementById("allSection")
            .scrollIntoView({
                behavior: "smooth"
            });

    }


    /* =========================
       SEARCH
    ========================= */

    const searchInput =
        document.getElementById("searchInput");


    searchInput.addEventListener(
        "input",
        handleSearch
    );


    function handleSearch() {

        const query =
            searchInput.value
                .trim()
                .toLowerCase();


        const searchSection =
            document.getElementById("searchSection");


        if (!query) {

            searchSection.style.display =
                "none";

            return;

        }


        const results =
            allItems.filter(item => {

                const title =
                    String(item.title || "")
                        .toLowerCase();

                const description =
                    String(item.description || "")
                        .toLowerCase();

                const category =
                    String(item.category || "")
                        .toLowerCase();


                return (
                    title.includes(query) ||
                    description.includes(query) ||
                    category.includes(query)
                );

            });


        searchSection.style.display =
            "block";


        renderGrid(
            document.getElementById("searchGrid"),
            results
        );


        searchSection.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }


    /* =========================
       NAVIGATION
    ========================= */

    function scrollToSection(id) {

        const section =
            document.getElementById(id);

        if (!section) {
            return;
        }


        section.scrollIntoView({
            behavior: "smooth"
        });

    }


    function goHome() {

        searchInput.value = "";

        document.getElementById("searchSection")
            .style.display = "none";


        renderGrid(
            document.getElementById("allGrid"),
            allItems
        );


        document.querySelector(
            "#allSection .section-title"
        ).textContent =
            "All Videos";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /* =========================
       FIND ITEM
    ========================= */

    function findItem(title) {

        return allItems.find(item =>
            item.title === title
        );

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================
       ESC KEY
    ========================= */

    document.addEventListener(
        "keydown",
        event => {

            if (event.key !== "Escape") {
                return;
            }


            closeVideoModal();

            closeSeriesModal();

        }
    );


    /* =========================
       START
    ========================= */

    loadData();

</script>

</body>
</html>
